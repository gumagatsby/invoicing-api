# Local stack: API, worker, PostgreSQL, Redis, and the observability tools.
name: invoicing

x-app-env: &app-env
  APP_DATABASE_URL: postgresql+asyncpg://invoicing:invoicing@db:5432/invoicing
  APP_REDIS_URL: redis://redis:6379/0
  APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env (see .env.example)}
  APP_OTEL_ENDPOINT: http://jaeger:4318
  APP_RATE_LIMIT_PER_MINUTE: ${APP_RATE_LIMIT_PER_MINUTE:-120}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: invoicing
      POSTGRES_USER: invoicing
      POSTGRES_PASSWORD: invoicing
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "invoicing"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  migrate:
    build: ./api
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db: {condition: service_healthy}

  api:
    build: ./api
    environment: *app-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 20

  worker:
    build: ./api
    command: ["arq", "app.worker.WorkerSettings"]
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  # The demo account, rebuilt on every start, and a receiver for its webhooks.
  demo:
    build: ./api
    command: ["python", "-m", "app.demo"]
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  receiver:
    build: ./api
    command: ["python", "-m", "app.demo_receiver"]

  web:
    build: ./web
    ports: ["127.0.0.1:8081:80"]
    depends_on: [api]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["127.0.0.1:16686:16686"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: [./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:
